spring.application.name=currency-exchange-test

# External API — stubbed by WireMock on a fixed local port (see @WireMockTest(httpPort = 8099)).
# Tests never touch the internet, so they are fast, deterministic and CI-safe.
exchange.api.url=http://localhost:8099

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.clean-disabled=false

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# RabbitMQ Configuration
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Business Rules
exchange.commission.rate=0.005

# Logging
logging.level.com.example.exchange=INFO
logging.level.org.springframework.amqp=WARN
logging.level.org.testcontainers=INFO
logging.level.org.hibernate.SQL=DEBUG
