spring.application.name=currency-exchange
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/exchange_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# External API
exchange.api.url=https://api.exchangerate-api.com/v4/latest
exchange.api.timeout=5000
exchange.api.retry.max-attempts=3

# Business Rules
exchange.commission.rate=0.005

# Logging
logging.level.com.example.exchange=DEBUG
logging.level.org.springframework.amqp=INFO
